<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Search | Made by Desearch</title>
<style>
body{font:16px/1.6 system-ui,sans-serif;max-width:900px;margin:3rem auto;padding:0 1rem;background:#f7faf8;color:#20352c}input,select,button{font:inherit;padding:.6rem;border:1px solid #7b998c;border-radius:6px}input{max-width:90%;width:26rem}button{cursor:pointer;background:#dcefe5}li{background:white;padding:1rem;margin:1rem 0;border-radius:8px;overflow-wrap:anywhere}a{color:#146b4a}.url{font-size:.85rem}p{margin:.5rem 0}
</style>
<h1>Web Search</h1>
<p>Made by <a href="https://desearch.ai" target="_blank" rel="noopener noreferrer">Desearch</a></p>
<p>Search the web with one Desearch API call per page.</p>
<form id="form"><label for="query">Search query</label><br><input id="query" minlength="2" maxlength="200" value="bittensor subnet" required>
<label for="page">Page</label> <select id="page"><option value="1">1</option><option value="2">2</option></select> <button id="submit">Search</button></form>
<p id="limits">Limits: 5 searches per 10 minutes, 15 per day per visitor</p>
<p id="status" role="status" aria-live="polite">Loading saved sample...</p>
<p id="cost">Request cost: $0</p>
<p><a href="/sample.json" target="_blank" rel="noopener noreferrer">View saved EXAMPLE JSON</a> <button id="sample" type="button">Show sample</button></p>
<ol id="results"></ol>
<script>
const $=id=>document.getElementById(id);
let generation=0;
function render(data){
 $('results').replaceChildren();
 for(const row of data.results || []){
  const li=document.createElement('li');
  let safe=false;
  try{const u=new URL(row.link);safe=['http:','https:'].includes(u.protocol);}catch{}
  const title=document.createElement(safe?'a':'span');
  title.textContent=row.title || row.link;
  if(safe){title.href=row.link;title.target='_blank';title.rel='noopener noreferrer';}
  const link=document.createElement('p');link.className='url';link.textContent=row.link;
  const snippet=document.createElement('p');snippet.textContent=row.snippet;
  li.append(title,link,snippet);$('results').append(li);
 }
 if(!data.results?.length)$('status').textContent='No results returned.';
}
async function sample(){
 const run=++generation;$('results').replaceChildren();$('cost').textContent='Request cost: $0';
 try{const response=await fetch('/sample.json');if(!response.ok)throw Error();const data=await response.json();if(run!==generation)return;render(data);$('status').textContent=data.label;}
 catch{if(run===generation){$('results').replaceChildren();$('status').textContent='Could not load the sample.';}}
}
$('sample').onclick=sample;
$('form').onsubmit=async event=>{
 event.preventDefault();const run=++generation;
 $('results').replaceChildren();$('cost').textContent='Request cost: $0';$('status').textContent='Searching...';$('submit').disabled=true;
 const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),55000);
 try{
  const response=await fetch('/api/search?'+new URLSearchParams({q:$('query').value,page:$('page').value}),{signal:controller.signal});
  const data=await response.json();if(run!==generation)return;
  $('cost').textContent='Request cost: $'+(response.headers.get('X-Desearch-Cost-Usd') || '0');
  if(data.limits)$('limits').textContent=`Limits: ${data.limits.per_ip} searches per 10 minutes, ${data.limits.per_ip_day} per day per visitor`;
  if(!response.ok)throw Error(data.error || 'Search failed. Try again later.');
  render(data);$('status').textContent=data.cached?'Cached result, up to 10 minutes old.':'Search complete.';
 }catch(error){if(run===generation){$('results').replaceChildren();$('status').textContent=error.name==='AbortError'?'Search timed out. Try again later.':error.message;}}
 finally{clearTimeout(timer);$('submit').disabled=false;}
};
sample();
</script>
</html>
